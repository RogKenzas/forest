name: forest
description: "Application de suivi d'inventaire forestier"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase  
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.3.5
  
  # UI & Navigation
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  
  # Utils
  intl: ^0.19.0
  uuid: ^4.2.1
  pdf: ^3.10.7
  printing: ^5.12.0
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  flutter_local_notifications: ^17.2.3
  path_provider: ^2.1.4
  csv: ^6.0.0
  
  # Charts & Analytics
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^26.2.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/logo/
    - assets/img/
